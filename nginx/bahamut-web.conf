# Bahamut XI website. Installed by `bahamut install` to
# /etc/nginx/sites-available/bahamut-web.conf; certbot then adds the HTTPS
# server block and the HTTP -> HTTPS redirect.

# Slow down password guessing on the sign-in, registration and launcher APIs.
limit_req_zone $binary_remote_addr zone=bahamut_auth:10m rate=10r/m;

upstream bahamut_web {
    server 127.0.0.1:@WEB_PORT@;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name @DOMAIN@ www.@DOMAIN@;

    client_max_body_size 2m;

    # Security headers (the site sets its own Content-Security-Policy).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location ~ ^/api/(auth|launcher/login|register) {
        limit_req zone=bahamut_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://bahamut_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /_next/static/ {
        proxy_pass http://bahamut_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://bahamut_web;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
